spring.datasource.url=jdbc:postgresql://localhost:5432/products?currentSchema=dev
spring.datasource.username=dev
spring.datasource.password=dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/changelog-master-dev.xml

# Actuators
management.endpoints.web.exposure.include=*

# Health endpoint
management.endpoint.health.show-details=always
management.health.disk_space_health.enabled=true
management.health.ramdom.enabled=true
